<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05090D"/>
      <stop offset="0.55" stop-color="#071116"/>
      <stop offset="1" stop-color="#040709"/>
    </linearGradient>
    <linearGradient id="accent" x1="270" y1="72" x2="885" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1F6F78" stroke-opacity="0.11" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- subtle code field -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#3DD6C5" opacity="0.22">
    <text x="34" y="46">from sklearn.metrics import roc_auc_score</text>
    <text x="34" y="64">risk = model.predict_proba(X)[:, 1]</text>
    <text x="34" y="82">auc = roc_auc_score(y, risk)</text>
    <text x="34" y="236">calibration → observed / predicted</text>
    <text x="34" y="254">patient-level split · temporal holdout</text>
  </g>

  <!-- calibration motif -->
  <g opacity="0.46" transform="translate(930 48)">
    <path d="M0 146H218M0 146V0" stroke="#2DD4BF" stroke-opacity="0.30"/>
    <path d="M6 138L212 10" stroke="#67E8F9" stroke-opacity="0.28" stroke-dasharray="4 6"/>
    <polyline points="12,135 42,118 72,101 102,84 132,65 162,48 192,28 212,16" fill="none" stroke="#2DD4BF" stroke-width="2"/>
    <g fill="#67E8F9">
      <circle cx="12" cy="135" r="3"/><circle cx="42" cy="118" r="3"/><circle cx="72" cy="101" r="3"/><circle cx="102" cy="84" r="3"/><circle cx="132" cy="65" r="3"/><circle cx="162" cy="48" r="3"/><circle cx="192" cy="28" r="3"/><circle cx="212" cy="16" r="3"/>
    </g>
    <text x="0" y="-12" fill="#2DD4BF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">CALIBRATION / VALIDATION</text>
  </g>

  <!-- pipeline motif -->
  <g opacity="0.32" transform="translate(895 235)" stroke="#34D399" fill="none">
    <rect x="0" y="0" width="62" height="22" rx="4"/><rect x="82" y="0" width="62" height="22" rx="4"/><rect x="164" y="0" width="62" height="22" rx="4"/>
    <path d="M62 11H82M144 11H164"/><path d="M76 7L82 11L76 15M158 7L164 11L158 15"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" fill="#34D399" opacity="0.50">
    <text x="907" y="249">DATA</text><text x="986" y="249">MODEL</text><text x="1066" y="249">EVALUATE</text>
  </g>

  <!-- central identity -->
  <g transform="translate(292 0)">
    <text x="0" y="128" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="72" font-weight="700" letter-spacing="10" fill="url(#accent)" filter="url(#glow)">YIFU ZHAO</text>
    <text x="4" y="174" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="500" letter-spacing="4" fill="#D7FFF7">DATA SCIENTIST  /  ANALYTICS ENGINEER</text>
    <line x1="4" y1="196" x2="607" y2="196" stroke="#2DD4BF" stroke-opacity="0.42"/>
    <text x="4" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="1.25" fill="#A7F3D0">ML VALIDATION  ·  HEALTHCARE DATA  ·  RISK ANALYTICS  ·  PYTHON  ·  SQL</text>
  </g>

  <!-- decorative nodes -->
  <g fill="#2DD4BF" opacity="0.36">
    <circle cx="248" cy="39" r="2"/><circle cx="263" cy="39" r="2"/><circle cx="278" cy="39" r="2"/>
    <circle cx="768" cy="52" r="2"/><circle cx="783" cy="52" r="2"/><circle cx="798" cy="52" r="2"/>
    <circle cx="833" cy="268" r="2"/><circle cx="848" cy="268" r="2"/><circle cx="863" cy="268" r="2"/>
  </g>
</svg>