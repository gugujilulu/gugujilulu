[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-policy-decision-science"
version = "2.1.0"
description = "Reproducible experiments and system economics for a synthetic fraud case"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fraud_case = ["explorer.html"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["data/generated", "results", "reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
