name: Refresh profile header

on:
  push:
    paths:
      - '.github/workflows/refresh-profile-header.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create cache-busted header and update README
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path('assets/profile-header.svg')
          dst = Path('assets/profile-header-v4.svg')
          s = src.read_text()

          old = 'values="478;518;554;590;626;662;698;734;770;807;807;478"'
          new = 'values="478;518;554;590;626;662;698;734;770;806;806;478"'
          if old not in s:
              raise SystemExit('Expected cursor sequence not found')
          s = s.replace(old, new, 1)
          dst.write_text(s)

          readme = Path('README.md')
          r = readme.read_text()
          old_ref = 'assets/profile-header.svg'
          new_ref = 'assets/profile-header-v4.svg'
          if old_ref not in r:
              raise SystemExit('Expected README header reference not found')
          readme.write_text(r.replace(old_ref, new_ref, 1))
          PY
      - name: Commit refreshed header
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-header-v4.svg README.md
          git commit -m "Refresh profile header asset and cursor alignment"
          git push
