name: Fix profile cursor

on:
  push:
    paths:
      - '.github/workflows/fix-profile-cursor.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix final cursor position
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/profile-header.svg')
          s = p.read_text()
          old = 'values="478;518;554;590;626;662;698;734;770;818;818;478"'
          new = 'values="478;518;554;590;626;662;698;734;770;807;807;478"'
          if old not in s:
              raise SystemExit('Expected cursor animation sequence not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-header.svg
          git commit -m "Fix final profile cursor position"
          git push
