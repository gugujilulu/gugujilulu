name: Fraud case reproducibility
on:
  push:
    paths:
      - 'projects/fraud-policy-decision-science/**'
      - '.github/workflows/fraud-case.yml'
  pull_request:
    paths:
      - 'projects/fraud-policy-decision-science/**'
      - '.github/workflows/fraud-case.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/fraud-policy-decision-science
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/fraud-policy-decision-science/requirements-dev-lock.txt
      - run: python -m pip install -r requirements-dev-lock.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v
      - run: python check_notebooks.py
      - run: python run_all.py
      - run: python check_artifacts.py
